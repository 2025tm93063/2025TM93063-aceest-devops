name: ACEest CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Lint & Syntax Check
  # ─────────────────────────────────────────
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Run flake8 linter
        run: |
          flake8 app.py test_app.py \
            --max-line-length=120 \
            --ignore=E501,W503 \
            --count \
            --statistics

  # ─────────────────────────────────────────
  # JOB 2: Run Unit & Integration Tests
  # ─────────────────────────────────────────
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest test_app.py -v --tb=short --cov=app --cov-report=term-missing

  # ─────────────────────────────────────────
  # JOB 3: Build Docker Image
  # ─────────────────────────────────────────
  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t aceest-fitness:${{ github.sha }} .
          docker build -t aceest-fitness:latest .

      - name: Smoke test the container
        run: |
          docker run -d \
            --name aceest-test \
            -p 5000:5000 \
            -e DB_PATH=/tmp/test.db \
            aceest-fitness:latest
          sleep 5
          curl --fail http://localhost:5000/health || (docker logs aceest-test && exit 1)
          docker stop aceest-test
          docker rm aceest-test
